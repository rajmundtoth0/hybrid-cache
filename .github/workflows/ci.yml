name: CI

on:
    push:
        branches:
            - master
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ["8.3", "8.4", "8.5"]

        services:
            valkey:
                image: valkey/valkey:8-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "valkey-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            # Enables tests/Integration against the service above (they are skipped without it).
            HYBRID_CACHE_TEST_VALKEY_HOST: 127.0.0.1
            HYBRID_CACHE_TEST_VALKEY_PORT: 6379

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2
                  extensions: redis, apcu, pcntl, posix
                  ini-values: apc.enable_cli=1

            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-${{ matrix.php }}-
                      ${{ runner.os }}-composer-

            - name: Install Dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run Tests
              run: composer test

            - name: Run Format Check
              run: composer format-ci

            - name: Run Static Analysis
              run: composer analyse

    coverage:
        runs-on: ubuntu-latest

        services:
            valkey:
                image: valkey/valkey:8-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "valkey-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            # Enables tests/Integration against the service above (they are skipped without it).
            HYBRID_CACHE_TEST_VALKEY_HOST: 127.0.0.1
            HYBRID_CACHE_TEST_VALKEY_PORT: 6379

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  coverage: xdebug
                  tools: composer:v2
                  extensions: redis, apcu, pcntl, posix
                  ini-values: apc.enable_cli=1

            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-coverage-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-coverage-
                      ${{ runner.os }}-composer-

            - name: Install Dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run Coverage
              run: composer test-coverage
